[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-kpk-profile-fl-lineage"
version = "0.1.0a3"
description = "Bounded exact Task43 KPK egress to UCP to Profile FL lineage bridge"
requires-python = ">=3.10"
dependencies = [
  "aisl-data-model-datamart-lineage==0.1.0a2",
  "aisl-sdk>=0.3.8,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kpk-profile-fl-lineage = "aisl_kpk_profile_fl_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_kpk_profile_fl_lineage*"]
