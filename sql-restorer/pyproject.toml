[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-sql-restorer"
version = "0.1.1"
description = "External AISL consumer to reconstruct prototype SQL from revision-pinned public SQL knowledge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "sqlglot>=30,<31"]

[tool.setuptools]
py-modules = ["aisl_sql_restore"]

[project.scripts]
aisl-sql-restore = "aisl_sql_restore:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
