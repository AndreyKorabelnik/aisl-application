[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-interaction-lineage"
version = "0.1.0a3"
description = "Deterministic interaction attribute lineage over Repository Topology and pinned AISL revisions"
requires-python = ">=3.10"
dependencies = ["aisl-sdk>=0.3.8,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
interaction-lineage = "aisl_interaction_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_interaction_lineage*"]
