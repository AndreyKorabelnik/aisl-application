[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-data-model-datamart-lineage"
version = "0.1.0a1"
description = "Bounded deterministic data-model to datamart lineage over pinned AISL revisions"
requires-python = ">=3.10"
dependencies = ["aisl-sdk>=0.3.8,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
data-model-datamart-lineage = "aisl_data_model_datamart_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_data_model_datamart_lineage*"]
