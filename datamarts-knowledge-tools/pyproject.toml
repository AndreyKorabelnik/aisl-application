[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-datamarts-knowledge-tools"
version = "0.1.0a1"
description = "Revision-pinned public AISL datamart tools for a weak-LLM consumer"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "RapidFuzz>=3.14,<4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aisldm = "aisl_datamarts_knowledge_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_datamarts_knowledge_tools*"]
