[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-ucp-tsa-replica-er"
version = "0.1.0a3"
description = "UCP declared relationships and identity keys projected onto TSA replica tables"
requires-python = ">=3.10"
dependencies = ["aisl-sdk>=0.3.8,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ucp-tsa-replica-er = "aisl_ucp_tsa_replica_er.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_ucp_tsa_replica_er*"]
