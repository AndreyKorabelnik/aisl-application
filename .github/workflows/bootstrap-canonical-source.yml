name: Bootstrap canonical application sources

on:
  push:
    branches: [main]
    paths:
      - repository-topology-source-canonical.zip
      - framework-reproducibility-source-canonical.zip

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish exact application sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f repository-topology-source-canonical.zip ] || [ ! -f framework-reproducibility-source-canonical.zip ]; then
            echo "Waiting for both canonical archives"
            exit 0
          fi
          test "$(sha256sum repository-topology-source-canonical.zip | awk '{print $1}')" = "23e893c834f71432e9080e43dce1c86180a0843a1008385573fa45f507bfe9b2"
          test "$(sha256sum framework-reproducibility-source-canonical.zip | awk '{print $1}')" = "e4b01df7cb43a0f06810e33380e977717b18ef3b8cf9b1d8bde26808a35906fb"
          EXPECTED_TREE="2b1faa3f2bb9ae664bea269d904e75df3a1c9f2a"
          rm -rf /tmp/topology /tmp/repro /tmp/final
          mkdir -p /tmp/topology /tmp/repro /tmp/final/repository-topology /tmp/final/framework-reproducibility
          unzip -q repository-topology-source-canonical.zip -d /tmp/topology
          unzip -q framework-reproducibility-source-canonical.zip -d /tmp/repro
          test -d /tmp/topology/repository-topology-0.1.0a8
          cp -a /tmp/topology/repository-topology-0.1.0a8/. /tmp/final/repository-topology/
          cp -a /tmp/repro/. /tmp/final/framework-reproducibility/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/final/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE="$(git write-tree)"
          test "$TREE" = "$EXPECTED_TREE"
          git commit -m "Import canonical external application sources"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin HEAD:main
