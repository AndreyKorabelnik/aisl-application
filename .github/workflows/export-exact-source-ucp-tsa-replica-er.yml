name: Export exact source snapshot for KPK Profile FL lineage app

on:
  push:
    branches:
      - automation/ucp-tsa-replica-er-source-export-20261005

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 3e7dfedc60965bf70413c51cdc28895b9e0a9f70
      SOURCE_TREE: dd8bfc885eccc8ff8d7de8d36f1e480359ef9130
      ARCHIVE_NAME: aisl-application-source-main-3e7dfedc.zip
      ARTIFACT_NAME: aisl-application-source-main-3e7dfedc
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="/tmp/$ARCHIVE_NAME" "$SOURCE_SHA"
          {
            echo "repository=AndreyKorabelnik/aisl-application"
            echo "commit=$SOURCE_SHA"
            echo "tree=$SOURCE_TREE"
            sha256sum "/tmp/$ARCHIVE_NAME"
          } > /tmp/source-identity.txt
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            /tmp/source-identity.txt
