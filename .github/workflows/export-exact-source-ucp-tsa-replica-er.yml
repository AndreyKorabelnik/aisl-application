name: Export exact source snapshot for KPK Profile FL lineage app

on:
  push:
    branches:
      - automation/ucp-tsa-replica-er-source-export-20261005

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: f6598f490d198a09e911a6ef3a502ddb2a169dcb
      SOURCE_TREE: d6ac9e79c018d2fc5e930d3b29ff109aba888e03
      ARCHIVE_NAME: aisl-application-source-main-f6598f49.zip
      ARTIFACT_NAME: aisl-application-source-main-f6598f49
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="/tmp/$ARCHIVE_NAME" "$SOURCE_SHA"
          {
            echo "repository=AndreyKorabelnik/aisl-application"
            echo "commit=$SOURCE_SHA"
            echo "tree=$SOURCE_TREE"
            sha256sum "/tmp/$ARCHIVE_NAME"
          } > /tmp/source-identity.txt
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            /tmp/source-identity.txt

