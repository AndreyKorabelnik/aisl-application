name: Export exact source snapshot for UCP TSA replica ER app

on:
  push:
    branches:
      - automation/ucp-tsa-replica-er-source-export-20261005

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 8cd36d236c4c24d5d214e4b33267d0f9fae2a9bc
      SOURCE_TREE: 413c7c9a1361d039dac92ff540ec0ee77b2fb579
      ARCHIVE_NAME: aisl-application-source-main-8cd36d23.zip
      ARTIFACT_NAME: aisl-application-source-main-8cd36d23
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="/tmp/$ARCHIVE_NAME" "$SOURCE_SHA"
          {
            echo "repository=AndreyKorabelnik/aisl-application"
            echo "commit=$SOURCE_SHA"
            echo "tree=$SOURCE_TREE"
            sha256sum "/tmp/$ARCHIVE_NAME"
          } > /tmp/source-identity.txt
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            /tmp/source-identity.txt
