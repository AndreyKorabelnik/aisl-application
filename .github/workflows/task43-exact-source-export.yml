name: Task46 exact source export
on:
  push:
    branches:
      - automation/task43-app-exact-source-export-20261003
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0eb0bd660d1418551ca0166082969a6b92d61418
          fetch-depth: 0
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0eb0bd660d1418551ca0166082969a6b92d61418"
          test "$(git rev-parse HEAD^{tree})" = "bab9b03e55b1aa33b0a91454cbec371911bb5ec5"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip 0eb0bd660d1418551ca0166082969a6b92d61418 -o aisl-application-source.zip
          sha256sum aisl-application-source.zip > source-archive.sha256
          printf 'repository=AndreyKorabelnik/aisl-application\ncommit=0eb0bd660d1418551ca0166082969a6b92d61418\nroot_tree=bab9b03e55b1aa33b0a91454cbec371911bb5ec5\n' > source-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aisl-application-source-main-0eb0bd6
          path: |
            aisl-application-source.zip
            source-archive.sha256
            source-identity.txt
          if-no-files-found: error
          retention-days: 1
