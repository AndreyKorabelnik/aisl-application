name: Task43 exact source export
on:
  push:
    branches:
      - automation/task43-app-exact-source-export-20261003
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f625561e2140fa79ed3278b5a1124e95dc8baadb
          fetch-depth: 0
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f625561e2140fa79ed3278b5a1124e95dc8baadb"
          test "$(git rev-parse HEAD^{tree})" = "cd817c129df4b33f37d5483234342c25b785f793"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip f625561e2140fa79ed3278b5a1124e95dc8baadb -o aisl-application-source.zip
          sha256sum aisl-application-source.zip > source-archive.sha256
          printf 'repository=AndreyKorabelnik/aisl-application\ncommit=f625561e2140fa79ed3278b5a1124e95dc8baadb\nroot_tree=cd817c129df4b33f37d5483234342c25b785f793\n' > source-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aisl-application-source-main-f625561
          path: |
            aisl-application-source.zip
            source-archive.sha256
            source-identity.txt
          if-no-files-found: error
          retention-days: 1
