name: Export exact source snapshot for Task 43

on:
  push:
    branches:
      - automation/task43-source-export-20261001

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 0134d5f1760de67d3382beee1cd432d9cbcec1f2
      SOURCE_TREE: 586e7cffe489c987b214a43951072fc920c35b4d
      ARCHIVE_NAME: aisl-application-source-main-0134d5f1.zip
      ARTIFACT_NAME: aisl-application-source-main-0134d5f1
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="/tmp/$ARCHIVE_NAME" "$SOURCE_SHA"
          {
            echo "repository=AndreyKorabelnik/aisl-application"
            echo "commit=$SOURCE_SHA"
            echo "tree=$SOURCE_TREE"
            sha256sum "/tmp/$ARCHIVE_NAME"
          } > /tmp/source-identity.txt
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            /tmp/source-identity.txt
