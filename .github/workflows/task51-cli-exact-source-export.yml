name: Task51 CLI exact source export
on:
  push:
    branches:
      - automation/infra-exact-source-bootstrap-20261011
permissions:
  contents: read
jobs:
  export-exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 414ef054f17164263b7b3cb9aad9996d67921ff7
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "414ef054f17164263b7b3cb9aad9996d67921ff7"
          test "$(git rev-parse HEAD^{tree})" = "f6a8c60edfb5351d353e901f3d1ccc44ac01641a"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=zip --output="$RUNNER_TEMP/source/source-canonical.zip" 414ef054f17164263b7b3cb9aad9996d67921ff7
          { echo "repository=AndreyKorabelnik/aisl-application"; echo "commit=414ef054f17164263b7b3cb9aad9996d67921ff7"; echo "root_tree=f6a8c60edfb5351d353e901f3d1ccc44ac01641a"; sha256sum "$RUNNER_TEMP/source/source-canonical.zip"; } > "$RUNNER_TEMP/source/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: infra-exact-source-aisl-application-414ef054f171
          path: ${{ runner.temp }}/source/
          retention-days: 2
          if-no-files-found: error
