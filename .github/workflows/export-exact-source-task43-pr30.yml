name: Export exact source snapshot for UCP TSA replica ER app

on:
  push:
    branches:
      - automation/task43-app30-exact-source-export-20261002

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 4c79f19e688e249cf8e8028cd5f75160e08721d7
      SOURCE_TREE: 63ab7577e32219006d5632dd1ca1f210baf79909
      ARCHIVE_NAME: aisl-application-source-main-4c79f19e.zip
      ARTIFACT_NAME: aisl-application-source-main-4c79f19e
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - name: Create exact Git archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="/tmp/$ARCHIVE_NAME" "$SOURCE_SHA"
          {
            echo "repository=AndreyKorabelnik/aisl-application"
            echo "commit=$SOURCE_SHA"
            echo "tree=$SOURCE_TREE"
            sha256sum "/tmp/$ARCHIVE_NAME"
          } > /tmp/source-identity.txt
      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 1
          path: |
            /tmp/${{ env.ARCHIVE_NAME }}
            /tmp/source-identity.txt
